{% if messages %}
    <div class="flex flex-col gap-2 mb-4 w-full">
        {% for message in messages %}
            <div class="alert {% if message.level_tag == 'error' %}alert-error{% elif message.level_tag == 'warning' %}alert-warning{% elif message.level_tag == 'success' %}alert-success{% else %}alert-info{% endif %} rounded-sm shadow-lg text-sm p-3 flex items-start w-full bg-opacity-90 backdrop-blur-sm"
                 role="alert">
                <svg class="w-5 h-5 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    {% if message.level_tag == 'error' %}
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    {% elif message.level_tag == 'success' %}
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    {% else %}
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    {% endif %}
                </svg>
                <span class="flex-1 font-medium">{{ message }}</span>
                <button type="button" class="btn btn-ghost btn-xs btn-circle opacity-70 hover:opacity-100"
                        onclick="this.closest('.alert').remove()">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
        {% endfor %}
    </div>
{% endif %}
