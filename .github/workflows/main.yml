name: CI/CD Pipeline

on:
  push:
    branches: [ "master" ] # Запуск тестов и деплоя при слиянии в master
  pull_request:
    branches: [ "master" ] # Запуск тестов при открытии/обновлении PR из dev
  workflow_dispatch: # Ручной запуск из интерфейса GitHub

jobs:
  # ==========================================
  # JOB 1: Tests and Linters (ID: test_and_lint)
  # ==========================================
  test_and_lint:
    name: Run Linters and Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: profiflow_test
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: runner_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Check Code Formatting (Ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Check Typing (Mypy)
        run: uv run mypy .

      - name: Run Pytest
        env:
          DATABASE_URL: postgres://runner:runner_password@localhost:5432/profiflow_test
          SECRET_KEY: django-insecure-ci-test-key
          DEBUG: "True"
        run: uv run pytest

  # ==========================================
  # JOB 2: Deploy to Production (ID: deploy_to_prod)
  # ==========================================
  deploy_to_prod:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [test_and_lint]

    # Деплоим только если это пуш в master или ручной запуск.
    # Игнорируем запуски из Pull Request.
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd ${{ secrets.PROJECT_PATH }}
            git pull origin master
            make prod-deploy
