# Динамический резолв через встроенный DNS Docker.
# Без этого после пересоздания web nginx стучится на старый IP → 502.
resolver 127.0.0.11 valid=10s ipv6=off;

# Отбрасываем запросы с чужим Host (сканеры, заход по IP)
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

# HTTP: ACME-проверки + редирект на HTTPS
server {
    listen 80;
    server_name profiflow.pro www.profiflow.pro;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name profiflow.pro www.profiflow.pro;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/profiflow.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/profiflow.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 20M;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Начни с 1 часа; когда убедишься, что HTTPS стабилен, подними до 31536000
    add_header Strict-Transport-Security "max-age=3600" always;

    set $django_upstream http://web:8000;

    location / {
        proxy_pass $django_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        # add_header внутри location отменяет унаследованные — повторяем HSTS
        add_header Strict-Transport-Security "max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
